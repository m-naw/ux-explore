<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><title>Cookie bar</title>
    <style>
      body { margin: 0; font-family: sans-serif; height: 100vh; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 88px; background: #222; color: #fff; z-index: 40; }
      #cta { position: absolute; left: 40px; bottom: 30px; }
    </style>
  </head>
  <body>
    <main><h1>Plans</h1><button id="cta" onclick="document.title='cta-clicked'">Choose plan</button></main>
    <div id="bar">
      <span>We use cookies.</span>
      <button id="ok" onclick="document.getElementById('bar').remove()">Got it</button>
    </div>
  </body>
</html>
