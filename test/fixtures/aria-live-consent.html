<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><title>Consent in a live region</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      /* The consent banner itself is the fixed ancestor; its inner wrapper is the live region,
         which is how several real cookie bars announce themselves. 200px of a 720px viewport
         is over the 20% overlay area ratio. */
      #consent { position: fixed; left: 0; right: 0; bottom: 0; height: 200px; background: #111; color: #fff; z-index: 50; }
    </style>
  </head>
  <body>
    <main><h1>Plans</h1><button id="cta" onclick="document.title='cta-clicked'">Choose plan</button></main>
    <div id="consent">
      <div aria-live="polite">
        <span>We use cookies.</span>
        <button id="accept" onclick="document.getElementById('consent').remove()">Accept all</button>
      </div>
    </div>
  </body>
</html>
