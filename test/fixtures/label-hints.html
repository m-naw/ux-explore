<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" /><title>Podpowiedzi etykiet</title>
  </head>
  <body>
    <main>
      <h1>Podpowiedzi etykiet</h1>
      <form>
        <!-- Named only by aria-label: an accessible name, but no associated label. -->
        <input id="city" name="c1" type="text" aria-label="Miasto" />

        <!-- The ordinary association: label[for] pointing at a visible control. -->
        <label for="phone">Telefon</label>
        <input id="phone" name="c2" type="tel" />

        <!-- The other association the name algorithm honours: a wrapping label. -->
        <label>Pracodawca <input id="employer" name="c3" type="text" /></label>
      </form>
    </main>
  </body>
</html>
