name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The browser tests are where the behaviour lives: extraction, occlusion, the click
  # fallbacks and the settle rules are all only meaningful against a real Chromium.
  test:
    name: lint + typecheck + full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
